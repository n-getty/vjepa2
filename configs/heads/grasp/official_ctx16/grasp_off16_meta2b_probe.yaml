# GraSP phase-recognition ASFormer probe -- CACHED head-training for the
# ORIGINAL Meta 2B V-JEPA 2.1 checkpoint (fair CPT-vs-Meta baseline).
#
# Reads the cache from grasp_phase_meta2b_export.yaml, trains ONLY the head.
# Comm-bound -> 1 node (12 ranks), batch_size 2 -> global batch 24 (matches
# fs_e159 head-train + Leonardo's live gb). SAME 3-LR head sweep as fs_e159 ->
# this is what closes the ledger's best-of-3-vs-1-head fairness gap.
cpus_per_task: 16
eval_name: video_classification_frozen
folder: /flare/ModCon/ngetty/surg_2_1_v2_final/probes/grasp_cached_official_ctx16/meta2b
mem_per_gpu: 220G
nodes: 1
num_workers: 16
resume_checkpoint: true
tag: grasp-off16-phase-meta2b
tasks_per_node: 4
model_kwargs:
  checkpoint: /flare/ModCon/ngetty/checkpoints/vjepa2_1_vitG_384.pt
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip_v21
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: 1
      model_name: vit_gigantic_xformers
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      use_sdpa: true
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
    preserve_clip_dim: true
experiment:
  classifier:
    name: asformer
    asformer_kwargs:
      num_clips: 4
      tokens_per_clip: 8
      temporal_tokens: 32
      num_layers: 10
      num_heads: 8
      mlp_ratio: 4.0
      dropout: 0.0
      return_sequence: true
  data:
    dataset_type: VideoDataset
    dataset_train: /flare/ModCon/ngetty/data/grasp_ctx_official/csv/grasp_phase_asformer_ctx_seq_train.csv
    dataset_val: /flare/ModCon/ngetty/data/grasp_ctx_official/csv/grasp_phase_asformer_ctx_seq_val.csv
    # Low-shot subsetting (train split only; val always full). 1.0 = full data.
    train_frac: 1.0
    subset_seed: 0
    num_classes: 11
    frames_per_clip: 16
    frame_step: 1
    resolution: 384
    num_segments: 4
    num_views_per_segment: 1
    sequence_labels: true
    normalization: null
    # class_weights = N / (K * count[c]) over grasp_long-term_train.json
    # (N=73619 keyframes, K=11). 0 Idle .. 10 Bladder_Neck_Rec.
    class_weights:
    - 0.319780
    - 0.663329
    - 0.854997
    - 0.878481
    - 2.683406
    - 1.502780
    - 1.192997
    - 4.036451
    - 1.733047
    - 2.727199
    - 1.010486
    cache_num_workers: 8
    train_cache_root: /flare/ModCon/ngetty/surg_2_1_v2_final/probes/grasp_cache_official_ctx16/meta2b/train
    val_cache_root: /flare/ModCon/ngetty/surg_2_1_v2_final/probes/grasp_cache_official_ctx16/meta2b/val
  optimization:
    batch_size: 2
    num_epochs: 20
    use_bfloat16: true
    loss_smoothing_weight: 0.15
    loss_smoothing_threshold: 4.0
    use_pos_embed: false
    # SAME GraSP 3-LR head sweep as fs_e159 -> best-of-3 vs best-of-3 (fair).
    multihead_kwargs:
    - warmup: 0.05
      start_lr: 5.0e-05
      lr: 0.0005
      final_lr: 5.0e-06
      weight_decay: 0.05
      final_weight_decay: 0.4
    - warmup: 0.05
      start_lr: 1.5e-05
      lr: 0.00015
      final_lr: 5.0e-06
      weight_decay: 0.05
      final_weight_decay: 0.4
    - warmup: 0.05
      start_lr: 5.0e-06
      lr: 5.0e-05
      final_lr: 5.0e-06
      weight_decay: 0.1
      final_weight_decay: 0.4
early_stop_patience: 6
log_val_f1: true
write_status_json: true
save_every_iters: 1000000000
