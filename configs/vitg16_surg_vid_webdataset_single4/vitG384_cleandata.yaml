meta:
  context_encoder_key: encoder
  dtype: bfloat16
  eval_freq: 1000000000
  load_checkpoint: true
  # Warm-start the predictor from Meta's trained ViT-G predictor (verified: loads
  # with 0 missing keys into our pred_depth24/embed384 arch after the encoder
  # embed_dim auto-scales it to 6656). Includes the predictor_proj_context head
  # the context loss needs.
  load_predictor: true
  pretrain_checkpoint: /flare/ModCon/ngetty/checkpoints/vjepa2_1_vitG_384.pt
  read_checkpoint: null
  save_every_freq: 5
  seed: 239
  target_encoder_key: target_encoder
  use_sdpa: true
model:
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  # Context (dense-prediction) loss — the defining V-JEPA 2.1 feature. Meta's
  # published ViT-G uses 0.5. The Lambda_LinearWarmupHold ramp is rescaled to our
  # 10k-iter run (start 500, full by 1500 = Meta's 5%->10% proportions).
  lambda_value_vid: 0.5
  lambda_start_iter: 500
  lambda_end_iter: 1500
  modality_embedding: true
  model_name: vit_gigantic_xformers
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 24
  pred_embed_dim: 384
  pred_is_causal: false
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  # IPE/EPOCHS RE-SLICED FOR THE 2B (vs the 1B's ipe500/epochs20). The 2B is
  # slower per iter (~7.9s @1n smoke; est ~8s @16n), so ipe500 = ~67min > the 1h
  # debug-chain walltime. We LOWER ipe but RAISE epochs to hold ipe*epochs
  # constant, because BOTH the LR cosine length (T_max, train.py:487) AND the EMA
  # momentum denominator (train.py:528) are computed from ipe*epochs*ipe_scale.
  #   333 * 30 = 9990 ~= the 1B's 500 * 20 = 10000 total steps.
  # => same total data/compute, same LR schedule, same EMA trajectory; the ONLY
  # change is checkpoints land every ~44min (fits 1h) instead of ~67min.
  # EMA is IPE-INVARIANT here anyway: ema=[0.99925,0.99925] is FLAT (start==end),
  # so the per-step momentum is constant 0.99925 regardless of ipe/epochs; only
  # the total step count matters, and that's held ~constant. (If EMA were a ramp
  # this re-slice would still be correct because the denom tracks ipe*epochs.)
  # warmup 2.0->3.0 epochs preserves ~1000 warmup STEPS (333*3=999 ~= 500*2=1000)
  # since warmup is specified in epochs and epochs got shorter.
  ema:
  - 0.99925
  - 0.99925
  epochs: 30
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 333
  ipe_scale: 1.0
  lr: 7.5e-05
  start_lr: 1.0e-06
  warmup: 3.0
  weight_decay: 0.04
