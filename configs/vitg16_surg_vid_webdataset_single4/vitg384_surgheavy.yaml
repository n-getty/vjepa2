  - 0.99925
  epochs: 20
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 500
  ipe_scale: 1.0
  lr: 7.5e-05
  start_lr: 1.0e-06
  warmup: 2.0
  weight_decay: 0.04
